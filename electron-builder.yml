appId: com.jarvis.assistant.v5
productName: Jarvis
copyright: "Copyright © 2026"

# node-hid ships prebuilt binaries; skip node-gyp rebuild (breaks on paths with spaces).
npmRebuild: false

directories:
  output: release
  buildResources: buildfiles

files:
  - dist-electron/**/*
  - package.json
  - node_modules/selfsigned/**/*
  - node_modules/node-forge/**/*
  - node_modules/http-proxy/**/*
  - node_modules/eventemitter3/**/*
  - node_modules/requires-port/**/*
  # USB touch-screen support (prebuilt N-API binary + its loader)
  - node_modules/node-hid/**/*
  - node_modules/pkg-prebuilds/**/*
  - "!node_modules/**"
  - "!release/**"
  - "!.next/**"
  - "!buildfiles/**"
  - "!electron/**"
  - "!electron-scripts/**"
  - "!app/**"
  - "!public/**"
  - "!scripts/**"
  - "!elements/**"
  - "!icon.png"
  # Runtime secrets / credentials must never be embedded in the app.asar.
  - "!jarvis-server-settings.json"
  - "!.bambu-token.json"
  - "!jarvis-mcp.config.json"
  - "!jarvis-skills.config.json"
  - "!jarvis-tls.json"
  - "!.env"
  - "!.env.local"
  - "!.env.*.local"

asarUnpack: []

extraResources:
  # Never pack a prior ./release into the app (causes recursive nesting + multi‑GB installers).
  - from: .next/standalone
    to: app
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!release/**"
      - "!electron/**"
      - "!electron-scripts/**"
      - "!buildfiles/**"
      - "!tsconfig*"
      - "!eslint*"
      - "!next.config*"
      - "!postcss*"
      - "!.pyinstaller/**"
      - "!.venv*/**"
      # Never bundle runtime secrets or credentials. These are written at
      # runtime to the per-user data dir (JARVIS_DATA_DIR); if a build is made
      # after logging in locally, stale copies can appear in .next/standalone,
      # so exclude them here as a hard backstop.
      - "!jarvis-server-settings.json"
      - "!.bambu-token.json"
      - "!jarvis-mcp.config.json"
      - "!jarvis-skills.config.json"
      - "!jarvis-tls.json"
      - "!.env"
      - "!.env.local"
      - "!.env.*.local"
  - from: .next/standalone/node_modules
    to: app/node_modules
  # Compiled Python binaries (computer_use, wake_word, etc.)
  - from: scripts/dist
    to: scripts/dist
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: buildfiles/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  # No Developer ID cert — skip codesigning entirely.
  # Users on macOS will right-click → Open the first time (Gatekeeper bypass).
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: buildfiles/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: buildfiles/icon.png
  category: Utility

dmg:
  title: "Jarvis Installer"
  window:
    width: 600
    height: 400
  contents:
    - x: 150
      y: 200
      type: file
    - x: 450
      y: 200
      type: link
      path: /Applications
