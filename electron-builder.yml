appId: com.jarvis.assistant.v5
productName: Jarvis
copyright: "Copyright © 2026"

# Updates come from Malc's fork. Without this block electron-builder guesses
# the GitHub owner from the build machine's git remote, which is how the
# original kcoda36 target ended up baked into app-update.yml.
publish:
  provider: github
  owner: malcmitch
  repo: JarvisV5

# Sign-in finishes in the browser and comes back as jarvis://auth?code=…, which
# only works if the installer claims the scheme with the OS.
protocols:
  - name: Jarvis
    schemes:
      - jarvis

# node-hid ships prebuilt binaries; skip node-gyp rebuild (breaks on paths with spaces).
npmRebuild: false

# Slower to pack, but the payload is dominated by compressible 3D assets and
# PyInstaller binaries, so it is worth tens of megabytes per installer.
compression: maximum

directories:
  output: release
  buildResources: buildfiles

files:
  # electron-builder resolves package.json "dependencies" (and their transitive
  # deps) automatically, which is how node-hid, selfsigned and http-proxy get
  # in. Do not hand-list node_modules paths here: a blanket "!node_modules/**"
  # alongside them silently wins and ships an asar with no native modules at
  # all, which disables USB touch input and the HTTPS phone proxy.
  - dist-electron/**/*
  - package.json
  # Source maps are ~2x the size of the emitted main-process JS and are only
  # useful against a local build.
  - "!dist-electron/**/*.map"
  - "!release/**"
  - "!.next/**"
  - "!buildfiles/**"
  - "!electron/**"
  - "!electron-scripts/**"
  - "!app/**"
  - "!public/**"
  - "!scripts/**"
  - "!elements/**"
  - "!icon.png"
  # Runtime secrets / credentials must never be embedded in the app.asar.
  - "!jarvis-server-settings.json"
  - "!.bambu-token.json"
  - "!jarvis-mcp.config.json"
  - "!jarvis-skills.config.json"
  - "!jarvis-tls.json"
  - "!.env"
  - "!.env.local"
  - "!.env.*.local"

asarUnpack: []

extraResources:
  # Never pack a prior ./release into the app (causes recursive nesting + multi‑GB installers).
  - from: .next/standalone
    to: app
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!art-source/**"
      - "!release/**"
      - "!electron/**"
      - "!electron-scripts/**"
      - "!buildfiles/**"
      - "!tsconfig*"
      - "!eslint*"
      - "!next.config*"
      - "!postcss*"
      - "!.pyinstaller/**"
      - "!.venv*/**"
      # Never bundle runtime secrets or credentials. These are written at
      # runtime to the per-user data dir (JARVIS_DATA_DIR); if a build is made
      # after logging in locally, stale copies can appear in .next/standalone,
      # so exclude them here as a hard backstop.
      - "!jarvis-server-settings.json"
      - "!.bambu-token.json"
      - "!jarvis-mcp.config.json"
      - "!jarvis-skills.config.json"
      - "!jarvis-tls.json"
      - "!.env"
      - "!.env.local"
      - "!.env.*.local"
  - from: .next/standalone/node_modules
    to: app/node_modules
  # Python source, used as a fallback when the compiled binary for this platform
  # is missing (the user's own Python 3 runs the .py instead).
  - from: scripts
    to: scripts
    filter:
      - "*.py"

# The compiled Python binaries are ~85 MB and `build:python` can only ever
# produce them for the host OS. They are attached per-target below so that, say,
# a Windows installer cross-built on a Mac does not carry Mach-O binaries it can
# never execute. Platform-specific extraResources are appended to the top-level
# list, not substituted for it.
mac:
  extraResources:
    - from: scripts/dist
      to: scripts/dist
      filter:
        - "**/*"
        - "!*.exe"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # electron-updater on macOS installs from zip, not dmg. Shipping the zip
    # costs nothing now and makes auto-update possible the moment the app is
    # signed; the dmg remains the human-facing download.
    - target: zip
      arch:
        - arm64
        - x64
  icon: buildfiles/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  # No Developer ID cert — skip codesigning entirely.
  # Users on macOS will right-click → Open the first time (Gatekeeper bypass).
  identity: null

win:
  extraResources:
    - from: scripts/dist
      to: scripts/dist
      filter:
        - "*.exe"
  target:
    - target: nsis
      arch:
        - x64
  icon: buildfiles/icon.png

nsis:
  artifactName: ${productName}-${version}-windows-x64-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

appImage:
  artifactName: ${productName}-${version}-linux-x86_64.${ext}

linux:
  extraResources:
    - from: scripts/dist
      to: scripts/dist
      filter:
        - "**/*"
        - "!*.exe"
  target:
    - target: AppImage
      arch:
        - x64
  icon: buildfiles/icon.png
  category: Utility

dmg:
  # Named by platform and architecture because the release page offers several at
  # once. electron-builder's default leaves the Intel build with no arch suffix at
  # all, so the two Mac downloads are indistinguishable to whoever has to choose.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  title: "Jarvis Installer"
  window:
    width: 600
    height: 400
  contents:
    - x: 150
      y: 200
      type: file
    - x: 450
      y: 200
      type: link
      path: /Applications
